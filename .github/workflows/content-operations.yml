name: Content and performance checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test:operations
      - run: yarn check:content
      - run: yarn test --watchAll=false
        env:
          CI: 'true'
      - run: yarn build
      - run: yarn check:budgets
      - run: yarn check:links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
